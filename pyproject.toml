[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localvoice"
version = "0.1.0"
description = "Hold a key, talk, and the text appears wherever your cursor is. Fully offline, NVIDIA Parakeet speech recognition, for Windows."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "onnx-asr[hub]>=0.12",
    "numpy>=1.22",
    "sounddevice>=0.4.6",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10",
]

[project.optional-dependencies]
# Pick exactly one ONNX Runtime flavour.
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.21"]  # NVIDIA GPU (CUDA + cuDNN pulled in via pip)
directml = ["onnxruntime-directml>=1.20"]    # Any DirectX 12 GPU (AMD / Intel / NVIDIA)
cpu = ["onnxruntime>=1.20"]
dev = ["pytest>=8"]

[project.scripts]
localvoice = "localvoice.__main__:main"

[project.gui-scripts]
localvoice-gui = "localvoice.__main__:main"

[tool.setuptools]
packages = ["localvoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
